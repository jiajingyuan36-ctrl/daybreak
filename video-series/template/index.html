<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<!-- 「读一张牌」系列模板：1080×1920 竖屏。由 render.mjs 打开，调用 init(EP, TL, BACK) 后逐帧调用 render(t)。
     视觉沿用晨启塔罗网站：近黑底、暖白字、香槟金细线、星盘细环、1909 RWS 原版牌面、网站同款牌背。 -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+SC:wght@300;400;500&display=block" rel="stylesheet">
<link href="story.css" rel="stylesheet">
<link href="/legacy-static/fonts/serif-sc.css" rel="stylesheet">
<link href="daybreak.css" rel="stylesheet">
<style>
:root{--bg:#0B0A0E;--hero:#EDE7DC;--body:#D9D2C5;--sub:#8F887C;--gold:#C5A56E;--gold-hi:#E6D2B5;--line:rgba(197,165,110,.3);
 --cb-bg-a:#17151E;--cb-bg-b:#0B0A0F;--cb-glow:#C5A059;--cb-f0:#7A5C29;--cb-f1:#C5A059;--cb-f2:#FFF2CC;--cb-f3:#D4AF37;--cb-f4:#6B4F22;--cb-hl:#FFF2CC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{position:relative;font-family:'Noto Serif SC',serif;color:var(--body);
 background:radial-gradient(ellipse 90% 45% at 50% 32%,rgba(46,42,58,.55),transparent 72%),radial-gradient(ellipse 80% 35% at 30% 100%,rgba(38,32,28,.5),transparent 70%),var(--bg)}
.el{position:absolute;opacity:0}
.center{left:0;width:1080px;text-align:center}
.lat{font-family:'Cinzel',serif}
.num{font-family:'Cormorant Garamond',serif}
#brand{top:200px;font-family:'Cinzel',serif;font-size:22px;letter-spacing:.38em;color:var(--sub)}
#brand b{font-weight:400;color:var(--gold)}
/* 星盘细环 */
#astro{position:absolute;left:40px;top:200px;width:1000px;height:1000px;opacity:.9}
/* 镜头取景区：上下边缘渐隐 */
#stage{position:absolute;left:0;top:262px;width:1080px;height:900px;overflow:hidden;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%)}
#cam{position:absolute;left:0;top:0;width:600px;height:1029px;transform-origin:0 0;perspective:2400px}
.face{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#flip{position:absolute;inset:0;transform-style:preserve-3d}
#front{background:#E9E1CF;border:1px solid rgba(212,175,55,.35);box-shadow:0 60px 120px -40px rgba(0,0,0,.95)}
#front img{display:block;width:100%;height:100%}
#back{transform:rotateY(180deg);background:var(--cb-bg-b);border:1px solid rgba(212,175,55,.32)}
#back svg,#nextBack svg,#promoBack svg{display:block;width:100%;height:100%}
#marks{position:absolute;inset:0;width:600px;height:1029px;overflow:visible}
#tags .tag{position:absolute;transform:translate(-50%,-50%);font-size:34px;color:var(--bg);background:var(--gold-hi);padding:4px 14px;border-radius:4px;opacity:0;letter-spacing:.08em}
/* 文字区 */
#kicker{top:1188px;font-family:'Cinzel',serif;font-size:24px;letter-spacing:.42em;color:var(--gold)}
#label{top:1230px;font-size:54px;font-weight:400;letter-spacing:.1em;color:var(--hero)}
#labelS{top:1306px;font-size:32px;font-weight:300;letter-spacing:.12em;color:var(--gold-hi)}
#sub{left:90px;width:900px;top:1372px;text-align:center;font-size:38px;font-weight:400;line-height:1.5;letter-spacing:.04em;color:var(--hero);text-shadow:0 2px 12px rgba(0,0,0,.9);text-wrap:balance}
#hookText{top:1220px;font-size:66px;font-weight:300;line-height:1.4;letter-spacing:.08em;color:var(--hero)}
#words{top:600px;font-size:84px;font-weight:300;letter-spacing:.14em;color:var(--hero)}
#words span{display:inline-block;opacity:0}
#words i{font-style:normal;color:var(--gold);margin:0 .3em;font-size:56px;vertical-align:middle}
#quote{top:560px;font-size:70px;font-weight:300;line-height:1.55;letter-spacing:.08em;color:var(--hero);white-space:pre-line}
#quoteRule{top:860px;left:390px;width:300px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#nextBack,#promoBack{position:absolute;overflow:hidden;border-radius:8px;border:1px solid rgba(212,175,55,.3);background:var(--cb-bg-b)}
#nextBack{left:390px;top:420px;width:300px;height:500px}
#nextK{top:1000px;font-family:'Cinzel',serif;font-size:26px;letter-spacing:.42em;color:var(--gold)}
#nextT{top:1060px;font-size:76px;font-weight:300;letter-spacing:.2em;color:var(--hero)}
#promoBack{left:410px;top:330px;width:260px;height:433px}
#p1{top:830px;font-family:'Cinzel',serif;font-size:66px;letter-spacing:.36em;padding-left:.36em;color:var(--hero)}
#p2{top:930px;font-size:46px;letter-spacing:.5em;padding-left:.5em;color:var(--gold-hi)}
#p3{top:1040px;left:390px;width:300px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
#p4{top:1080px;font-size:40px;font-weight:300;letter-spacing:.08em;line-height:1.8;color:var(--body)}
#p5{top:1260px;font-size:30px;letter-spacing:.1em;color:var(--sub)}
#p5 i{font-style:normal;color:var(--gold);margin:0 16px}
#disc{top:1360px;font-size:24px;letter-spacing:.08em;color:#6E685E}
</style></head><body>
<svg id="astro" viewBox="-500 -500 1000 1000"><g id="astroG" fill="none" stroke="#C5A56E"><circle r="480" stroke-opacity=".10"/><circle r="440" stroke-opacity=".06" stroke-dasharray="2 12"/><circle r="330" stroke-opacity=".05"/><g id="ticks"></g></g></svg>
<p class="el center" id="brand">DAYBREAK · 读一张牌 <b id="epno"></b></p>
<header class="el" id="daybreakHeader">
 <span class="lat">DAYBREAK</span><span id="daybreakSeries"></span>
</header>
<div class="el" id="daybreakMoon" aria-hidden="true">
 <svg viewBox="-120 -120 240 240"><g id="daybreakDial"></g><circle r="79" stroke-dasharray="1 3" stroke-opacity=".22"/></svg>
 <canvas width="256" height="256"></canvas>
</div>
<div id="stage"><div id="cam"><div id="flip"><div class="face" id="front"><img id="cardImg"></div><div class="face" id="back"></div></div>
 <svg id="marks" viewBox="0 0 600 1029"></svg></div></div>
<div id="tags"></div>
<p class="el center" id="kicker"></p><p class="el center" id="label"></p><p class="el center" id="labelS"></p>
<p class="el center" id="hookText"></p>
<p class="el" id="sub"></p>
<p class="el center" id="words"></p>
<p class="el center" id="quote"></p><div class="el" id="quoteRule"></div>
<div class="el" id="nextBack"></div><p class="el center" id="nextK">NEXT</p><p class="el center" id="nextT"></p>
<div class="el" id="promoBack"></div>
<p class="el center" id="p1">DAYBREAK</p><p class="el center" id="p2">晨启塔罗</p><div class="el" id="p3"></div>
<p class="el center" id="p4">每天早上抽一张牌<br>用大白话说说今天的状态</p>
<p class="el center" id="p5">1909 原版牌面<i>·</i>78 张正逆位解读<i>·</i>不用注册</p>
<p class="el center" id="disc">塔罗文化与艺术科普 · 内容仅供参考</p>
<div id="storyEra" class="el story-panel">
 <p id="eraK" class="story-eyebrow"></p><p id="eraYear" class="num"></p>
 <div id="eraRule"></div><p id="eraPlace"></p>
</div>
<div id="storyCompare" class="el story-panel">
 <p id="compareK" class="story-eyebrow"></p><div id="compareCards"></div>
</div>
<div id="storyPerson" class="el story-panel">
 <p id="personK" class="story-eyebrow"></p><img id="personPortrait" alt="">
 <div id="personDiamond"></div><p id="personName" class="num"></p>
 <p id="personYears" class="num"></p><p id="personBio"></p>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, out=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,k)=>a+(b-a)*k;
function vis(e,o,dy=0,extra=''){e=typeof e==='string'?$(e):e;e.style.opacity=o;e.style.visibility=o<=.001?'hidden':'visible';e.style.transform=(dy?`translateY(${dy}px) `:'')+extra}
// 在 [a,b] 内显示：淡入上浮、结尾淡出
function win(t,a,b,fi=.6,fo=.45){const i=out((t-a)/fi),o=b>=1e9?1:1-ease((t-(b-fo))/fo);return {o:clamp(Math.min(i,o)),i}}
(()=>{let s='';for(let i=0;i<72;i++){const a=i*5*Math.PI/180,l=i%6===0,r0=l?456:466;s+=`<line x1="${Math.sin(a)*r0}" y1="${-Math.cos(a)*r0}" x2="${Math.sin(a)*480}" y2="${-Math.cos(a)*480}" stroke-opacity="${l?.16:.07}"/>`}$('ticks').innerHTML=s})();

const STAGE={w:1080,h:900},BASE=900/1029; // 牌高 = 取景区高度时的缩放
let EP,TL,SEG={},SC={},DUR;
const lemniscate=(cx,cy,w)=>{let d='';for(let i=0;i<=120;i++){const t=i/120*2*Math.PI,den=1+Math.sin(t)**2,x=Math.cos(t)/den,y=Math.sin(t)*Math.cos(t)/den;d+=(i?'L':'M')+(cx+x*w/2).toFixed(1)+' '+(cy+y*w/2*1.05).toFixed(1)}return d};
window.init=(ep,tl,back,storyCopy)=>{EP=ep;TL=tl;DUR=tl[tl.length-1].end;
 if(ep.series==='story')return initStory(ep,tl,back,storyCopy);
 tl.forEach(s=>{SEG[s.id]=s;SC[s.scene]??=s});
 $('cardImg').src=`/public/rws/${ep.card}.webp`;$('back').innerHTML=back;$('nextBack').innerHTML=back;$('promoBack').innerHTML=back;
 $('epno').textContent='No.'+String(ep.no).padStart(2,'0');$('nextT').textContent=ep.next?ep.next.nameZh:'';
 // 标记层：在牌面坐标里画，跟镜头一起缩放；线宽不随缩放
 let m='';const g=ep.hookGlyphAt;if(ep.hookGlyph==='lemniscate')m+=`<path id="glyph" d="${lemniscate(g[0],g[1],g[2])}" fill="none" stroke="#E6D2B5" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`;
 tl.forEach(s=>{if(!s.mark)return;const k=s.mark;
  if(k.type==='ellipse')m+=`<ellipse class="mk" data-seg="${s.id}" cx="${k.at[0]}" cy="${k.at[1]}" rx="${k.r[0]}" ry="${k.r[1]}" fill="none" stroke="rgba(11,10,14,.5)" stroke-width="7" vector-effect="non-scaling-stroke"/><ellipse class="mk" data-seg="${s.id}" cx="${k.at[0]}" cy="${k.at[1]}" rx="${k.r[0]}" ry="${k.r[1]}" fill="none" stroke="#E6D2B5" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
  if(k.type==='points')k.pts.forEach(p=>m+=`<g class="mk" data-seg="${s.id}"><circle cx="${p[0]}" cy="${p[1]}" r="26" fill="none" stroke="rgba(11,10,14,.5)" stroke-width="7" vector-effect="non-scaling-stroke"/><circle cx="${p[0]}" cy="${p[1]}" r="26" fill="none" stroke="#E6D2B5" stroke-width="3" vector-effect="non-scaling-stroke"/><circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#E6D2B5" stroke="rgba(11,10,14,.5)" stroke-width="2" vector-effect="non-scaling-stroke"/></g>`)});
 $('marks').innerHTML=m;const gl=$('glyph');if(gl){const L=gl.getTotalLength();gl.style.strokeDasharray=L;gl.style.strokeDashoffset=L;gl.dataset.len=L}
 $('marks').querySelectorAll('ellipse.mk').forEach(e=>{const L=e.getTotalLength();e.style.strokeDasharray=L;e.dataset.len=L});
 $('tags').innerHTML=tl.filter(s=>s.mark&&s.mark.type==='tags').flatMap(s=>s.mark.tags.map(([x,y,t])=>`<span class="tag" data-seg="${s.id}" data-x="${x}" data-y="${y}">${t}</span>`)).join('');
 return Promise.all([document.fonts.ready,$('cardImg').decode().catch(()=>{})])};

// —— 镜头：每段一个目标 [x,y,zoom]（牌面像素坐标），段首 1.1 秒缓动过去，段内缓慢推近
const FULL=[300,514.5,1];
function camTarget(s){if(!s)return FULL;if(s.scene==='hook')return [300,470,1.08];if(s.focus)return s.focus;if(s.scene==='title')return [300,514.5,.98];return FULL}
function camera(t){let i=TL.findIndex(s=>t<s.end);if(i<0)i=TL.length-1;const s=TL[i],prev=TL[i-1];const k=ease((t-s.start)/1.1);
 const a=camTarget(prev),b=camTarget(s);const c=[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
 const drift=1+.035*clamp((t-s.start)/Math.max(1,s.end-s.start));c[2]*=drift;
 if(s.scene==='hook'){const p=ease((t-1.8)/2.2);c[0]=lerp(300,EP.hookGlyphAt[0],p);c[1]=lerp(470,EP.hookGlyphAt[1]+60,p);c[2]=lerp(1.0,1.9,p)}
 if(prev&&prev.scene==='hook'&&s.scene==='title'){const p=ease((t-s.start)/1.4);c[0]=lerp(EP.hookGlyphAt[0],300,p);c[1]=lerp(EP.hookGlyphAt[1]+60,514.5,p);c[2]=lerp(1.9*1.035,.98,p)}
 return c}
const toScreen=(c,x,y)=>{const s=BASE*c[2];return [STAGE.w/2+(x-c[0])*s,262+STAGE.h/2+(y-c[1])*s]};

window.render=function(t){
 $('astroG').setAttribute('transform',`rotate(${t*1.1})`);
 if(EP.series==='story')return renderStory(t);
 const cur=TL.find(s=>t>=s.start&&t<s.end)||TL[TL.length-1];
 vis('brand',win(t,.6,SC.promo.start+.3,1.2).o);
 // 牌：镜头 + 翻面 + 逆位旋转
 const c=camera(t),s=BASE*c[2];
 const flip=180*(1-ease((t-.7)/1.3));
 const rev=SC.reversed?180*(ease((t-SC.reversed.start)/1.1)-ease((t-SC.reversed.end+.2)/1)):0;
 $('flip').style.transform=`rotateY(${flip}deg)`;
 $('cam').style.transformOrigin=`${c[0]}px ${c[1]}px`;
 $('cam').style.transform=`translate(${STAGE.w/2-c[0]}px,${STAGE.h/2-c[1]}px) scale(${s}) rotate(${rev}deg)`;
 const dim=cur.scene==='summary'?.28:1;
 const cardOut=SC.quote?ease((t-SC.quote.start)/.8):0;
 $('stage').style.opacity=lerp(win(t,0,1e9,.9).o*dim,0,cardOut);$('stage').style.filter=cur.scene==='summary'?`blur(${4*ease((t-cur.start)/.8)}px)`:'none';
 // 开场：∞ 一笔画出
 const gl=$('glyph');if(gl){const L=+gl.dataset.len,p=ease((t-2.0)/1.6);gl.style.strokeDashoffset=L*(1-p);gl.style.opacity=t<SC.title.start?1:1-ease((t-SC.title.start)/.8)}
 // 标记
 $('marks').querySelectorAll('.mk').forEach(e=>{const sg=SEG[e.dataset.seg],w=win(t,sg.start+.9,sg.end,.5,.35);e.style.opacity=w.o;if(e.dataset.len)e.style.strokeDashoffset=e.dataset.len*(1-ease((t-sg.start-.9)/.9))});
 $('tags').querySelectorAll('.tag').forEach((e,i)=>{const sg=SEG[e.dataset.seg],[x,y]=toScreen(c,+e.dataset.x,+e.dataset.y);const w=win(t,sg.start+1.1+(i%4)*.35,sg.end,.4,.3);e.style.left=x+'px';e.style.top=y+'px';e.style.opacity=w.o});
 // 段落文字
 const lab=TL.find(s=>t>=s.start-.05&&t<s.end&&(s.label||['title','upright','reversed'].includes(s.scene)));
 if(lab){const w=win(t,lab.start+.5,lab.end);let k='',L='',S='';
  if(lab.scene==='title'){k='No.'+String(EP.no).padStart(2,'0')+' · '+EP.nameEn;L=EP.nameZh}
  else if(lab.scene==='upright'){k='UPRIGHT';L='正位';S=lab.keywords.join(' · ')}
  else if(lab.scene==='reversed'){k='REVERSED';L='逆位';S=lab.keywords.join(' · ')}
  else{L=lab.label.t;S=lab.label.s}
  $('kicker').textContent=k;$('label').textContent=L;$('labelS').textContent=S;
  vis('kicker',w.o,(1-w.i)*12);vis('label',w.o,(1-w.i)*16);vis('labelS',win(t,lab.start+.9,lab.end).o,(1-w.i)*12)}else{vis('kicker',0);vis('label',0);vis('labelS',0)}
 // 开场钩子大字
 const h=SC.hook,hw=win(t,h.start+2.6,h.end+.2,.8);$('hookText').textContent=h.sub;vis('hookText',hw.o,(1-hw.i)*20);
 // 字幕
 const sb=TL.find(s=>t>=s.start&&t<s.end&&s.sub&&!['hook','next','quote'].includes(s.scene));
 if(sb){$('sub').textContent=sb.sub;vis('sub',win(t,sb.start+.15,sb.end,.25,.2).o)}else vis('sub',0);
 // 总结三词
 if(SC.summary){const sg=SC.summary;if(!$('words').dataset.on){$('words').innerHTML=sg.words.map(w=>`<span>${w}</span>`).join('<i>·</i>');$('words').dataset.on=1}
  vis('words',win(t,sg.start+.3,sg.end).o);$('words').querySelectorAll('span').forEach((e,i)=>{const w=win(t,sg.start+.9+i*.55,sg.end,.6);e.style.opacity=w.o;e.style.transform=`translateY(${(1-w.i)*18}px)`})}
 // 金句
 if(SC.quote){const sg=SC.quote,w=win(t,sg.start+.6,sg.end,.8);$('quote').textContent=sg.quote;vis('quote',w.o,(1-w.i)*20);vis('quoteRule',win(t,sg.start+1.2,sg.end).o)}
 // 下一期
 if(SC.next){const sg=SC.next,w=win(t,sg.start,sg.end,.6);vis('nextBack',w.o,(1-w.i)*30,`rotateY(${18*Math.sin((t-sg.start)*1.4)}deg)`);vis('nextK',win(t,sg.start+.3,sg.end).o);vis('nextT',win(t,sg.start+.5,sg.end).o)}
 // 宣传
 const p=SC.promo.start;[['promoBack',0,30],['p1',.7,14],['p2',1.1,14],['p3',1.5,0],['p4',1.9,14],['p5',2.8,10],['disc',3.3,0]].forEach(([id,d,dy])=>{const w=win(t,p+d,1e9,.9);vis(id,w.o,(1-w.i)*dy)});
 document.body.style.filter=t>DUR-.7?`brightness(${clamp((DUR-t)/.7)})`:'';
};
</script><script src="story.js"></script></body></html>

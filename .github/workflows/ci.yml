# 每次推送到 main、每个 PR 都跑一遍：类型检查、全部测试、生产构建。
# 通过了才说明这版能安全发布。
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 牌的数据文件（src/data）是构建的第一步生成的，类型检查和测试都要用到，所以先生成
      - run: npm run prebuild
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
